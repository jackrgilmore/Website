<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation — Jack Gilmore</title>
    <meta name="description" content="Jack Gilmore's animation: gallery and series.">

    <!-- Light/dark mode (first, so the page never flashes the wrong one) -->
    <script src="/theme.js"></script>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400..700;1,400..700&display=swap"
        rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="/site.css">

    <!-- Scripts (nav, shared helpers, then this page's own) -->
    <script src="/nav.js" defer></script>
    <script src="/catalog.js" defer></script>
    <script src="/animation.js" defer></script>
</head>

<body>

    <main class="page">
        <header class="page-head">
            <h1>Animation</h1>
        </header>

        <!-- Featured reel -->
        <section class="section reel-block" id="featured" aria-label="Demo reel"></section>

        <!-- Gallery / Series -->
        <div class="view-switch" role="group" aria-label="View as">
            <button type="button" data-view="gallery" aria-pressed="true">Gallery</button>
            <button type="button" data-view="series" aria-pressed="false">Series</button>
        </div>

        <section id="view-gallery">
            <p class="loading">Loading videos...</p>
        </section>
        <section id="view-series" hidden></section>
    </main>

</body>

</html>
