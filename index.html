<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/favicon.ico" sizes="32x32">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="alternate" type="application/rss+xml" title="Jack Gilmore — Blog" href="/feed.xml">
    <title>Jack Gilmore</title>
    <meta name="description" content="Animation, comics and writing by Jack Gilmore, animator from Concord, Massachusetts.">
    <!-- What a shared link shows (Open Graph): title, description, picture -->
    <meta property="og:site_name" content="Jack Gilmore">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Jack Gilmore">
    <meta property="og:description" content="Animation, comics and writing by Jack Gilmore, animator from Concord, Massachusetts.">
    <meta property="og:image" content="https://jackgilmorecreative.com/og.png">
    <meta property="og:url" content="https://jackgilmorecreative.com/">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="canonical" href="https://jackgilmorecreative.com/">

    <!-- Light/dark mode (first, so the page never flashes the wrong one) -->
    <script src="/theme.js"></script>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400..700;1,400..700&display=swap"
        rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="/site.css">

    <!-- Scripts (nav, shared helpers, then this page's own) -->
    <script src="/nav.js" defer></script>
    <script src="/analytics.js" defer></script>
    <script src="/catalog.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js" defer></script>
    <script src="/home.js" defer></script>
</head>

<body>

    <!-- The home page: everything on the site, newest first. (The page about
         me, to send people, is /about.html.) home.js fills in the parts. -->
    <main class="page home">
        <header class="home-head">
            <h1>Jack Gilmore</h1>
            <p>Animation, comics and writing from Concord, Massachusetts.
                <a href="/about.html">About me&nbsp;→</a></p>
        </header>

        <!-- The big search box: typing in it opens the site search (search.js) -->
        <form class="home-search" role="search" action="javascript:void(0)">
            <svg class="home-search-icon" viewBox="0 0 16 16" aria-hidden="true">
                <circle cx="7" cy="7" r="4.5" /><path d="m10.5 10.5 3.5 3.5" />
            </svg>
            <input type="search" placeholder="Search animation, comics, writing, notes…" autocomplete="off"
                spellcheck="false" aria-label="Search the site">
            <kbd class="home-search-key" aria-hidden="true">/</kbd>
        </form>

        <!-- One link per part of the site, in its search color, with a count -->
        <nav class="home-jump" id="home-jump" aria-label="Parts of the site"></nav>

        <!-- The reel, and the newest thing in each part of the site -->
        <div class="home-top">
            <section aria-labelledby="home-reel-title">
                <div class="home-label">
                    <h2 id="home-reel-title">Demo reel</h2>
                    <span id="home-reel-share"></span>
                </div>
                <div id="home-reel"><p class="loading">Loading...</p></div>
            </section>
            <section aria-labelledby="home-new-title">
                <div class="home-label">
                    <h2 id="home-new-title">Latest</h2>
                </div>
                <div id="home-new"><p class="loading">Loading...</p></div>
            </section>
        </div>

        <section class="section" id="animation" aria-labelledby="animation-title">
            <div class="section-head">
                <h2 id="animation-title">Animation</h2>
                <a href="/animation.html">watch it all →</a>
            </div>
            <div id="home-animation"><p class="loading">Loading...</p></div>
        </section>

        <section class="section" id="read" aria-labelledby="read-title">
            <div class="section-head">
                <h2 id="read-title">Comics &amp; writing</h2>
                <a href="/read.html">read it all →</a>
            </div>
            <div id="home-read"><p class="loading">Loading...</p></div>
        </section>

        <section class="section" id="garden" aria-labelledby="garden-title">
            <div class="section-head">
                <h2 id="garden-title">Garden</h2>
                <a href="/garden.html">the garden →</a>
            </div>
            <p class="section-intro">Notes in progress, and how they link.</p>
            <div id="home-garden"><p class="loading">Loading...</p></div>
        </section>
    </main>

</body>

</html>
